name: Email notification dispatch

on:
  workflow_dispatch:
  # Scheduled execution intentionally remains disabled until the owner completes
  # the production migration, deployment, and manual-dispatch verification.
  # schedule:
  #   - cron: '*/10 * * * *'

permissions: {}

concurrency:
  group: email-notification-dispatch
  cancel-in-progress: false

jobs:
  disabled:
    if: ${{ vars.EMAIL_DISPATCH_ENABLED != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm dispatch is disabled
        run: echo "Email dispatch is disabled; no Backend request was made."

  dispatch:
    if: ${{ vars.EMAIL_DISPATCH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DISPATCH_URL: https://api.tareeq-academy.com/internal/cron/email-notifications
    steps:
      - name: Validate scheduler secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error::Required GitHub Actions secret CRON_SECRET is not configured."
            exit 1
          fi

      - name: Dispatch pending email notifications
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/email-notification-dispatch-response.json"
          trap 'rm -f "${response_file}"' EXIT

          if ! http_status="$(curl \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 45 \
            --retry 2 \
            --retry-delay 2 \
            --retry-max-time 90 \
            --retry-all-errors \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            "${DISPATCH_URL}")"; then
            echo "::error::Email dispatch request failed because of a network or timeout error."
            exit 1
          fi

          if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Email dispatch endpoint returned HTTP ${http_status}."
            exit 1
          fi

          echo "Email dispatch completed successfully with HTTP ${http_status}."
